<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nytt ärende</title>
</head>
<body>
    <h1>Nytt ärende</h1>

    <p th:if="${error != null}" th:text="${error}" role="alert"></p>

    <form th:action="@{/tickets}" method="post">
        <p>
            <label for="title">Rubrik</label><br>
            <input id="title" name="title" type="text" maxlength="255" required th:value="${title}">
        </p>
        <p>
            <label for="description">Beskrivning</label><br>
            <textarea id="description" name="description" rows="5" maxlength="4000" required th:text="${description}"></textarea>
        </p>
        <button type="submit">Skapa ärende</button>
    </form>

    <p><a th:href="@{/tickets}">Tillbaka till ärenden</a></p>
</body>
</html>
